<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Dashboard · Credit Book</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body data-page="dashboard">
    <div class="app">
      <header class="app-header">
        <div class="header-row">
          <h1>Credit Book</h1>
        </div>
      </header>

      <div class="hero-card" id="heroCard">
        <div class="hero-avatar-wrap">
          <div class="hero-avatar" id="heroAvatar">
            <span class="hero-avatar-default" id="heroAvatarDefault" aria-hidden="true">👤</span>
            <img
              class="hero-avatar-img"
              id="heroAvatarImg"
              alt=""
              hidden
            />
          </div>
          <button
            type="button"
            class="hero-avatar-upload"
            id="heroAvatarUpload"
            aria-label="Upload photo"
            title="Upload photo"
          >
            📷
          </button>
          <input
            type="file"
            id="heroAvatarInput"
            accept="image/*"
            hidden
          />
        </div>
        <div class="hero-text" id="heroText" role="button" tabindex="0">
          <div class="hero-title" id="heroTitle">Welcome to Credit Book</div>
          <div class="hero-sub" id="heroSub">
            Create your business profile to get started
          </div>
        </div>
      </div>

      <main class="content">
        <div class="dashboard-grid">
          <div class="stat-card">
            <div class="stat-icon bg-green">👛</div>
            <div>
              <div class="stat-label">Total Outstanding</div>
              <div class="stat-value green" id="totalOutstanding">R0.00</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon bg-orange">📈</div>
            <div>
              <div class="stat-label">Today's Credit</div>
              <div class="stat-value orange" id="todayCredit">R0.00</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon bg-green-light">✓</div>
            <div>
              <div class="stat-label">Payments Received Today</div>
              <div class="stat-value green" id="todayPayments">R0.00</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon bg-orange">📅</div>
            <div>
              <div class="stat-label">Due Today</div>
              <div class="stat-value orange" id="dueTodayCount">0</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon bg-red">⚠️</div>
            <div>
              <div class="stat-label">Overdue Accounts</div>
              <div class="stat-value red" id="overdueCount">0</div>
            </div>
          </div>
        </div>

        <h2 class="section-title">Quick Actions</h2>
        <div class="quick-actions-grid">
          <a class="action-btn bg-green" href="add-customer.html">
            <span class="action-icon">👤➕</span>
            Add Customer
          </a>
          <a class="action-btn bg-orange" href="record-credit.html">
            <span class="action-icon">🛍️➕</span>
            Record Credit
          </a>
        </div>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item" data-nav="dashboard" href="dashboard.html"
          ><span class="nav-icon">🏠</span>Dashboard</a
        >
        <a class="nav-item" data-nav="customers" href="customers.html"
          ><span class="nav-icon">👥</span>Customers</a
        >
        <a class="nav-item" data-nav="transactions" href="transactions.html"
          ><span class="nav-icon">📋</span>Transactions</a
        >
        <a class="nav-item" data-nav="reports" href="reports.html"
          ><span class="nav-icon">📊</span>Reports</a
        >
        <a class="nav-item" data-nav="reminders" href="reminders.html"
          ><span class="nav-icon">🔔</span>More</a
        >
      </nav>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
