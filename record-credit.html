<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f7a4d" />
  <title>Record Credit · Credit Book</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/record-credit.css" />
</head>
<body data-page="record-credit">
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <a class="icon-btn" href="dashboard.html">←</a>
        <h1>Record Credit</h1>
      </div>
    </header>

    <main class="content">
      <form id="recordCreditForm" autocomplete="off">
        <div class="form-group">
          <label for="customerSelect">Customer</label>
          <select class="form-control" id="customerSelect" name="customer" required></select>
        </div>

        <div class="form-group">
          <div class="row-between">
            <label>Quick Items</label>
            <button type="button" class="link-btn" id="manageItemsBtn">Edit</button>
          </div>
          <div id="quickItems" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;"></div>
        </div>

        <div class="form-group">
          <label for="itemName">Item / Description</label>
          <input class="form-control" id="itemName" name="itemName" type="text" placeholder="e.g. Bread, Airtime" required />
        </div>

        <div class="form-group">
          <label for="amount">Amount (R)</label>
          <input class="form-control" id="amount" name="amount" type="number" step="0.01" min="0" placeholder="0.00" required />
        </div>

        <div class="form-group">
          <label for="dueDate">Due Date</label>
          <input class="form-control" id="dueDate" name="dueDate" type="date" required />
        </div>

        <div class="form-group">
          <label for="productPhotoInput">Product Photo</label>
          <input
            type="file"
            id="productPhotoInput"
            accept="image/*"
            capture="environment"
            hidden
          />
          <div class="product-photo-empty" id="productPhotoEmpty">
            <button type="button" class="product-photo-trigger" id="productPhotoTrigger">
              📷 Take / Upload Photo
            </button>
          </div>
          <div class="product-photo-preview" id="productPhotoPreview" hidden>
            <img id="productPhotoPreviewImg" alt="Product photo preview" />
            <div class="product-photo-actions">
              <button type="button" class="btn btn-outline product-photo-btn" id="changePhotoBtn">
                Change Photo
              </button>
              <button type="button" class="btn btn-outline product-photo-btn" id="removePhotoBtn">
                Remove Photo
              </button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Customer Signature</label>
          <div class="signature-wrap" id="signatureWrap">
            <canvas
              id="signatureCanvas"
              class="signature-canvas"
              aria-label="Customer signature pad"
            ></canvas>
            <span class="signature-placeholder" id="signaturePlaceholder">Customer signs here</span>
          </div>
          <div class="signature-actions">
            <button type="button" class="btn btn-outline signature-btn" id="clearSignatureBtn">
              Clear Signature
            </button>
            <button type="button" class="btn btn-primary signature-btn" id="saveSignatureBtn">
              Save Signature
            </button>
          </div>
        </div>

        <button class="btn btn-accent mt-16" type="submit">Add to Credit</button>
      </form>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item" data-nav="dashboard" href="dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a>
      <a class="nav-item" data-nav="customers" href="customers.html"><span class="nav-icon">👥</span>Customers</a>
      <a class="nav-item" data-nav="transactions" href="transactions.html"><span class="nav-icon">📋</span>Transactions</a>
      <a class="nav-item" data-nav="reports" href="reports.html"><span class="nav-icon">📊</span>Reports</a>
      <a class="nav-item" data-nav="reminders" href="reminders.html"><span class="nav-icon">🔔</span>More</a>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/credit.js"></script>
</body>
</html>
