<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f7a4d" />
  <title>Customer Profile · Credit Book</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/customer-profile.css" />
</head>
<body data-page="customer-profile">
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <a class="icon-btn" href="customers.html">←</a>
        <h1>Customer Profile</h1>
        <span class="spacer"></span>
        <button class="icon-btn" id="deleteBtn" title="Delete">🗑️</button>
      </div>
    </header>

    <div id="profileRoot">
      <div class="profile-card">
        <div class="profile-head">
          <div class="avatar" id="profileAvatar">👤</div>
          <div>
            <div class="profile-name" id="profileName">—</div>
            <div class="profile-phone" id="profilePhone">—</div>
            <div class="profile-phone" id="profileMeta" style="display:none;"></div>
          </div>
        </div>

        <div class="credit-summary" id="creditSummary">
          <div class="summary-row">
            <span class="summary-label">Total Credit</span>
            <span class="summary-value" id="totalCredit">R0.00</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Total Paid</span>
            <span class="summary-value" id="totalPaid">R0.00</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Remaining Balance</span>
            <span class="summary-value" id="remainingBalance">R0.00</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Due Date</span>
            <span class="summary-value" id="profileDueDate">—</span>
          </div>
          <div class="summary-row summary-status">
            <span class="summary-label">Status</span>
            <span id="profileStatus"></span>
          </div>
        </div>

        <div class="balance-box" id="balanceBox">
          <div class="label">Current Balance</div>
          <div class="value">R0.00</div>
        </div>

        <div class="actions-grid mt-16">
          <button class="action-btn bg-orange" id="recordCreditBtn"><span class="action-icon">🛍️</span>Add Credit</button>
          <button class="action-btn bg-green" id="markPaymentBtn"><span class="action-icon">💵</span>Mark Payment</button>
        </div>
      </div>

      <main class="content">
        <h2 class="section-title">Credit History</h2>
        <ul class="list" id="historyList"></ul>

        <div class="profile-remind-wrap">
          <button class="btn btn-primary" id="remindBtn">🔔 Send Reminder</button>
        </div>
      </main>
    </div>

    <nav class="bottom-nav">
      <a class="nav-item" data-nav="dashboard" href="dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a>
      <a class="nav-item" data-nav="customers" href="customers.html"><span class="nav-icon">👥</span>Customers</a>
      <a class="nav-item" data-nav="transactions" href="transactions.html"><span class="nav-icon">📋</span>Transactions</a>
      <a class="nav-item" data-nav="reports" href="reports.html"><span class="nav-icon">📊</span>Reports</a>
      <a class="nav-item" data-nav="reminders" href="reminders.html"><span class="nav-icon">🔔</span>More</a>
    </nav>
  </div>

  <div class="photo-modal" id="photoModal" hidden>
    <div class="photo-modal-backdrop" id="photoModalBackdrop"></div>
    <div class="photo-modal-content">
      <button type="button" class="photo-modal-close" id="photoModalClose" aria-label="Close preview">×</button>
      <img id="photoModalImg" alt="Product photo" />
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
