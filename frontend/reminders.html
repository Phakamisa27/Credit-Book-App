<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Reminders · ThathaCash</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/reminders.css" />
  </head>
  <body data-page="reminders" data-protected>
    <div class="app-shell" id="appShell">
      <div class="app-main">
        <header class="app-header">
          <div class="header-row">
            <a class="icon-btn" href="dashboard.html" title="Back">←</a>
            <h1>Reminders</h1>
            <span class="spacer"></span>
            <button class="icon-btn" id="newReminderBtn" type="button" title="New reminder">＋</button>
          </div>
          <p class="subtitle">Who to chase, and a message ready to send.</p>
        </header>

        <main class="content">
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-icon bg-red">⚠️</div>
              <div>
                <div class="stat-label">Overdue</div>
                <div class="stat-value red" id="statOverdueReminders">0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon bg-orange">📅</div>
              <div>
                <div class="stat-label">Due Soon</div>
                <div class="stat-value orange" id="statDueSoonReminders">0</div>
              </div>
            </div>
          </div>

          <div class="toolbar mt-24">
            <div class="form-group">
              <label for="statusFilter">Show</label>
              <select class="form-control" id="statusFilter">
                <option value="OPEN">Open reminders</option>
                <option value="">All reminders</option>
                <option value="PENDING">Pending</option>
                <option value="SENT">Sent</option>
                <option value="DONE">Done</option>
              </select>
            </div>
          </div>

          <section class="panel">
            <div class="panel-head">
              <h2>Message Language</h2>
              <div class="segment">
                <button type="button" class="active" data-lang="en">English</button>
                <button type="button" data-lang="zu">isiZulu</button>
              </div>
            </div>
            <div class="panel-body">
              <div class="pv-label">Message preview</div>
              <p class="preview-box" id="messagePreview">—</p>
              <p class="form-hint">
                Sending opens WhatsApp or your SMS app with this message ready to go.
              </p>
            </div>
          </section>

          <h2 class="section-title">Reminders</h2>
          <div id="reminderList"></div>
        </main>
      </div>
    </div>

    <!-- New reminder -->
    <div class="modal" id="newReminderModal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="newReminderTitle">
        <div class="modal-head">
          <h3 id="newReminderTitle">New Reminder</h3>
          <button type="button" class="modal-close" data-close aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <form id="newReminderForm" novalidate>
            <p id="newReminderError" class="form-error" hidden></p>

            <div class="form-group">
              <label for="reminderCustomerId">Customer *</label>
              <select class="form-control" id="reminderCustomerId" name="customerId" required></select>
            </div>

            <div class="form-group">
              <label for="newReminderAmount">Amount (R) *</label>
              <input class="form-control" id="newReminderAmount" name="amount" type="number"
                step="0.01" min="0.01" required />
            </div>

            <div class="form-group">
              <label for="newReminderDueDate">Due Date *</label>
              <input class="form-control" id="newReminderDueDate" name="dueDate" type="date" required />
            </div>

            <div class="form-group">
              <label for="newReminderNotes">Notes <span class="muted">(optional)</span></label>
              <textarea class="form-control" id="newReminderNotes" name="notes" rows="2"></textarea>
            </div>

            <div class="modal-actions">
              <button class="btn btn-outline" type="button" data-close>Cancel</button>
              <button class="btn btn-primary" type="submit">Save Reminder</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/reminders.js"></script>
  </body>
</html>
