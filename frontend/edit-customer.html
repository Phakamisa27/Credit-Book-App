<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Edit Customer · ThathaCash</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/add-customer.css" />
  </head>
  <body data-page="edit-customer" data-protected>
    <div class="app-shell" id="appShell">
      <div class="app-main">
        <header class="app-header">
          <div class="header-row">
            <a class="icon-btn" id="backLink" href="customers.html" title="Back">←</a>
            <h1>Edit Customer</h1>
          </div>
          <p class="subtitle" id="editingName">—</p>
        </header>

        <main class="content">
          <form id="customerForm" autocomplete="off" novalidate>
            <p id="formError" class="form-error" hidden></p>

            <div class="form-row two">
              <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input class="form-control" id="fullName" name="fullName" type="text" required />
              </div>

              <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input class="form-control" id="phone" name="phone" type="tel"
                  inputmode="numeric" maxlength="12" required />
              </div>
            </div>

            <div class="form-row two">
              <div class="form-group">
                <label for="email">Email <span class="muted">(optional)</span></label>
                <input class="form-control" id="email" name="email" type="email" />
              </div>

              <div class="form-group">
                <label for="address">Address / Area <span class="muted">(optional)</span></label>
                <input class="form-control" id="address" name="address" type="text" />
              </div>
            </div>

            <div class="form-group">
              <span class="form-label" id="genderLabel">Gender <span class="muted">(optional)</span></span>
              <div class="gender-options" role="radiogroup" aria-labelledby="genderLabel">
                <label class="gender-option">
                  <input type="radio" name="gender" value="male" />
                  <span>Male</span>
                </label>
                <label class="gender-option">
                  <input type="radio" name="gender" value="female" />
                  <span>Female</span>
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="notes">Notes <span class="muted">(optional)</span></label>
              <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
            </div>

            <div class="btn-row">
              <button class="btn btn-primary" type="submit">Save Changes</button>
              <a class="btn btn-outline" href="customers.html">Cancel</a>
            </div>
          </form>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/customers.js"></script>
  </body>
</html>
