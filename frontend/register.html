<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#185f3c" />
    <title>Register · Credit Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body data-page="register">
    <div class="login-page">
      <header class="login-hero login-hero--compact">
        <div class="login-hero-inner">
          <h1 class="login-hero-title">Create Account</h1>
          <p class="login-hero-sub">Already have an account?</p>
          <a class="login-register-btn" href="login.html">Login</a>
        </div>
      </header>

      <main class="login-main login-main--compact">
        <h2 class="login-heading">Register</h2>

        <form id="registerForm" class="login-form" autocomplete="on" novalidate>
          <p id="authError" class="form-error" hidden></p>

          <div class="login-field">
            <input class="login-input" id="fullName" name="fullName" type="text"
              autocomplete="name" placeholder="Your full name" required />
          </div>

          <div class="login-field">
            <input class="login-input" id="email" name="email" type="email"
              autocomplete="username" placeholder="Email address" required />
          </div>

          <div class="login-field">
            <input class="login-input" id="businessName" name="businessName" type="text"
              autocomplete="organization" placeholder="Business name (optional)" />
          </div>

          <div class="login-field">
            <input class="login-input" id="businessPhone" name="businessPhone" type="tel"
              inputmode="numeric" maxlength="12" placeholder="Business phone (optional)" />
          </div>

          <div class="login-field">
            <input class="login-input" id="password" name="password" type="password"
              autocomplete="new-password" minlength="8" placeholder="Password" required />
          </div>

          <div class="login-field">
            <input class="login-input" id="confirmPassword" name="confirmPassword" type="password"
              autocomplete="new-password" minlength="8" placeholder="Confirm password" required />
          </div>

          <p class="login-hint">Password must be at least 8 characters.</p>

          <button class="login-submit-btn" type="submit">Register</button>
        </form>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
