<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f7" />
    <title>Transactions · ThathaCash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/thathacash.css" />
  </head>
  <body class="tc" data-page="transactions" data-protected>
    <div class="app-shell" id="appShell">
      <div class="app-main">
        <header class="tc-top">
          <div class="tc-top-inner">
            <h1>Transactions</h1>
            <span class="spacer"></span>
            <button class="tc-add-btn" type="button" id="addEntryBtn">＋ Log money</button>
          </div>
        </header>

        <main class="content">
          <div class="filter-bar" role="group" aria-label="Show">
            <button class="filter-chip active" type="button" data-type="">All</button>
            <button class="filter-chip" type="button" data-type="INCOME">Income</button>
            <button class="filter-chip" type="button" data-type="EXPENSE">Expenses</button>
            <button class="filter-chip" type="button" data-type="STOCK">Stock</button>
            <button class="filter-chip" type="button" data-type="DRAW">Draws</button>
          </div>

          <select class="form-control period-select" id="period" aria-label="Period">
            <option value="today">Today</option>
            <option value="week">This week</option>
            <option value="month" selected>This month</option>
            <option value="lastMonth">Last month</option>
            <option value="all">All time</option>
          </select>

          <div class="totals-row">
            <div class="total-card in">
              <div class="total-card-label">↑ Total income</div>
              <div class="total-card-amount" id="totalIncome">R0</div>
            </div>
            <div class="total-card out">
              <div class="total-card-label">↓ Money out</div>
              <div class="total-card-amount" id="totalOut">R0</div>
            </div>
          </div>

          <div class="breakdown" aria-label="Money out, by kind">
            <div><small>Expenses</small><strong id="totalExpenses">R0</strong></div>
            <div><small>Stock</small><strong id="totalStock">R0</strong></div>
            <div><small>Draws</small><strong id="totalDraws">R0</strong></div>
          </div>

          <section class="tc-section">
            <div class="tc-section-head"><h2 id="listTitle">All transactions</h2></div>
            <div class="tc-card" id="entryList"></div>
            <p class="tc-hint">Tap an entry to see it or delete a mistake.</p>
          </section>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/cash-entry.js"></script>
    <script src="js/money.js"></script>
  </body>
</html>
