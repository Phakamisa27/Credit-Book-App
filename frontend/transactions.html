<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Transactions · Credit Book</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/transactions.css" />
  </head>
  <body data-page="transactions" data-protected>
    <div class="app-shell" id="appShell">
      <div class="app-main">
        <header class="app-header">
          <div class="header-row">
            <a class="icon-btn" href="dashboard.html" title="Back">←</a>
            <h1>Transactions</h1>
            <span class="spacer"></span>
            <a class="icon-btn" href="record-credit.html" title="Record credit">＋</a>
          </div>
          <p class="subtitle" id="txCount">—</p>
        </header>

        <main class="content">
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-icon bg-orange">📈</div>
              <div>
                <div class="stat-label">Credit Issued (filtered)</div>
                <div class="stat-value orange" id="txTotalCredit">R0.00</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon bg-green">💵</div>
              <div>
                <div class="stat-label">Payments Received (filtered)</div>
                <div class="stat-value green" id="txTotalPayments">R0.00</div>
              </div>
            </div>
          </div>

          <div class="toolbar mt-24">
            <div class="form-group">
              <label for="typeFilter">Type</label>
              <select class="form-control" id="typeFilter">
                <option value="">All types</option>
                <option value="CREDIT">Credit only</option>
                <option value="PAYMENT">Payments only</option>
              </select>
            </div>
            <div class="form-group">
              <label for="fromDate">From</label>
              <input class="form-control" id="fromDate" type="date" />
            </div>
            <div class="form-group">
              <label for="toDate">To</label>
              <input class="form-control" id="toDate" type="date" />
            </div>
            <button class="btn btn-outline btn-sm" type="button" id="clearFilters">Clear</button>
          </div>

          <section class="panel">
            <div class="table-wrap" id="txWrap" hidden>
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Due</th>
                    <th class="num">Amount</th>
                  </tr>
                </thead>
                <tbody id="txBody"></tbody>
              </table>
            </div>
            <div id="txEmpty"></div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/transactions.js"></script>
  </body>
</html>
