<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Customers · Credit Book</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/customers.css" />
  </head>
  <body data-page="customers" data-protected>
    <div class="app-shell" id="appShell">
      <div class="app-main">
        <header class="app-header">
          <div class="header-row">
            <a class="icon-btn" href="dashboard.html" title="Back">←</a>
            <h1>Customers</h1>
            <span class="spacer"></span>
            <a class="icon-btn" href="add-customer.html" title="Add customer">＋</a>
          </div>
          <p class="subtitle" id="customerCount">—</p>
        </header>

        <main class="content">
          <div class="search">
            <span class="search-icon">🔍</span>
            <input
              id="searchInput"
              class="form-control"
              type="search"
              placeholder="Search by name or phone number…"
              autocomplete="off"
            />
          </div>

          <div class="filter-bar" id="filterBar">
            <button type="button" class="filter-chip active" data-filter="ALL">All</button>
            <button type="button" class="filter-chip" data-filter="OWING">Owing</button>
            <button type="button" class="filter-chip" data-filter="OVERDUE">Overdue</button>
            <button type="button" class="filter-chip" data-filter="PAID">Paid up</button>
          </div>

          <div id="customerList"></div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/customers.js"></script>
  </body>
</html>
