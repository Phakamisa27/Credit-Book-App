<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f7" />
    <title>Home · ThathaCash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/thathacash.css" />
  </head>
  <!-- Still called dashboard.html so login redirects and old links keep working.
       Home shows ONE number. Stock, transactions and draws live in the menu. -->
  <body class="tc" data-page="home" data-protected>
    <div class="app-shell" id="appShell">
      <div class="app-main">
        <header class="tc-top">
          <div class="tc-top-inner">
            <a class="tc-brand" href="dashboard.html" id="brand">ThathaCash</a>
          </div>
        </header>

        <main class="content">
          <section class="tc-hello">
            <h2 id="greeting">Sawubona</h2>
            <p id="helloSub">Loading your shop…</p>
          </section>

          <!-- Step 1. On its own until the cash is counted. -->
          <section class="setup-card" id="setupCard" hidden>
            <h3>Count your cash 👋</h3>
            <p>How much cash is in your shop right now? Count the till and your cash box.</p>
            <form id="setupForm" novalidate>
              <input class="form-control" id="startingCash" type="number" inputmode="decimal"
                min="0.01" step="0.01" placeholder="e.g. 3000" aria-label="Cash in your shop, in rand" />
              <button class="btn btn-primary" type="submit">Save</button>
            </form>
          </section>

          <!-- Step 2, and every visit after it. -->
          <div id="cashView" hidden>
            <a class="cash-hero" href="transactions.html" id="cashHero">
              <span class="cash-hero-icon" aria-hidden="true">💵</span>
              <span>
                <span class="cash-hero-label">Cash available</span><br />
                <span class="cash-hero-amount" id="cashAvailable">R0</span>
              </span>
            </a>

            <!-- The 30% rule is detail, not a second headline. -->
            <details class="cash-details">
              <summary>
                <span>Safe to draw</span>
                <strong id="safeToUse">R0</strong>
              </summary>
              <div class="cash-details-body">
                <div class="row-between">
                  <span>Set aside</span>
                  <strong id="keptForExpenses">R0</strong>
                </div>
                <p id="reserveHint"></p>
              </div>
            </details>

            <a class="low-stock-line" id="lowStockLine" href="stock.html" hidden>
              <span aria-hidden="true">📦</span>
              <span id="lowStockText">Items running low</span>
              <span class="tc-chevron" id="lowStockChevron"></span>
            </a>

            <button class="btn btn-primary mt-16" type="button" id="logMoneyBtn">
              ＋ Log money
            </button>
          </div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/cash-entry.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
