<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#185f3c" />
    <title>Login · Credit Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body data-page="login">
    <div class="login-page">
      <header class="login-hero">
        <div class="login-hero-inner">
          <h1 class="login-hero-title">Hello, Welcome</h1>
          <p class="login-hero-sub" data-when="no-account">
            Don't have an account?
          </p>
          <a
            class="login-register-btn"
            href="register.html"
            data-when="no-account"
            >Register</a
          >
        </div>
      </header>

      <main class="login-main">
        <h2 class="login-heading">Login</h2>

        <form id="loginForm" class="login-form" autocomplete="on" novalidate>
          <p id="authError" class="form-error" hidden></p>

          <div class="login-field">
            <input
              class="login-input"
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="Email address"
              required
            />
            <span class="login-field-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M3 7l9 6 9-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>

          <!-- The show/hide password button is added here by auth.js. -->
          <div class="login-field">
            <input
              class="login-input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Password"
              required
            />
          </div>

          <button class="login-submit-btn" type="submit">Login</button>
        </form>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
