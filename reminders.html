<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f7a4d" />
  <title>Reminders · Credit Book</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/reminders.css" />
</head>
<body data-page="reminders">
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <a class="icon-btn" href="dashboard.html">←</a>
        <h1>Reminders</h1>
      </div>
      <p class="subtitle">Send friendly reminders · Khumbuza amakhasimende akho</p>
    </header>

    <main class="content narrow" id="remindersRoot">
      <div class="form-group">
        <label for="reminderCustomer">Customer</label>
        <select class="form-control" id="reminderCustomer"></select>
      </div>

      <h2 class="section-title">Send Reminder Via</h2>
      <div class="radio-card selected" data-channel="whatsapp">
        <div class="rc-icon bg-green-light">💬</div>
        <div class="rc-main">
          <div class="rc-title">WhatsApp</div>
          <div class="rc-sub">Thumela i-WhatsApp</div>
        </div>
        <div class="radio-dot"></div>
      </div>
      <div class="radio-card" data-channel="sms">
        <div class="rc-icon bg-orange">✉️</div>
        <div class="rc-main">
          <div class="rc-title">SMS</div>
          <div class="rc-sub">Thumela i-SMS</div>
        </div>
        <div class="radio-dot"></div>
      </div>

      <h2 class="section-title">Reminder Language / Ulimi</h2>
      <div class="segment">
        <button class="active" data-lang="en">English</button>
        <button data-lang="zu">isiZulu</button>
      </div>

      <div class="preview-box mt-16">
        <div class="pv-label">Reminder Message Preview</div>
        <div class="muted" id="previewPhone" style="font-size:0.85rem;margin-bottom:8px;"></div>
        <div id="previewBody"></div>
      </div>

      <button class="btn btn-primary mt-16" id="sendBtn">Send Reminder</button>

      <div class="sync-card">
        <div class="sync-icon">✓</div>
        <div class="sync-main">
          <div class="sync-title">Offline Sync Status</div>
          <div class="sync-sub" id="lastSynced">Last synced: —</div>
        </div>
        <button class="btn btn-primary" id="syncBtn" style="width:auto;padding:10px 16px;">Sync Now</button>
      </div>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item" data-nav="dashboard" href="dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a>
      <a class="nav-item" data-nav="customers" href="customers.html"><span class="nav-icon">👥</span>Customers</a>
      <a class="nav-item" data-nav="transactions" href="transactions.html"><span class="nav-icon">📋</span>Transactions</a>
      <a class="nav-item" data-nav="reports" href="reports.html"><span class="nav-icon">📊</span>Reports</a>
      <a class="nav-item" data-nav="reminders" href="reminders.html"><span class="nav-icon">🔔</span>More</a>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/reminders.js"></script>
</body>
</html>
