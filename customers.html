<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Customers · Credit Book</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/customers.css" />
  </head>
  <body data-page="customers">
    <div class="app">
      <header class="app-header">
        <div class="header-row">
          <a class="icon-btn" href="dashboard.html">←</a>
          <h1>Customers</h1>
          <span class="spacer"></span>
          <a class="icon-btn" href="add-customer.html">＋</a>
        </div>
      </header>

      <main class="content">
        <div class="search">
          <span class="search-icon">🔍</span>
          <input
            id="searchInput"
            class="form-control"
            type="search"
            placeholder="Search name or phone…"
          />
        </div>

        <div class="filter-bar" id="filterBar">
          <button type="button" class="filter-chip active" data-filter="all">All Accounts</button>
          <button type="button" class="filter-chip" data-filter="due-today">Due Today</button>
          <button type="button" class="filter-chip" data-filter="overdue">Overdue</button>
          <button type="button" class="filter-chip" data-filter="paid">Paid</button>
        </div>

        <div id="customerList"></div>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item" data-nav="dashboard" href="dashboard.html"
          ><span class="nav-icon">🏠</span>Dashboard</a
        >
        <a class="nav-item" data-nav="customers" href="customers.html"
          ><span class="nav-icon">👥</span>Customers</a
        >
        <a class="nav-item" data-nav="transactions" href="transactions.html"
          ><span class="nav-icon">📋</span>Transactions</a
        >
        <a class="nav-item" data-nav="reports" href="reports.html"
          ><span class="nav-icon">📊</span>Reports</a
        >
        <a class="nav-item" data-nav="reminders" href="reminders.html"
          ><span class="nav-icon">🔔</span>More</a
        >
      </nav>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/customers.js"></script>
  </body>
</html>
