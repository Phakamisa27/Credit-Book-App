<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#185f3c" />
    <title>Register · Credit Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body data-page="register">
    <div class="login-page">
      <header class="login-hero login-hero--compact">
        <div class="login-hero-inner">
          <h1 class="login-hero-title">Create Account</h1>
          <p class="login-hero-sub">Already have an Account</p>
          <a class="login-register-btn" href="login.html">Login</a>
        </div>
      </header>

      <main class="login-main login-main--compact">
        <h2 class="login-heading">Register</h2>

        <form id="registerForm" class="login-form" autocomplete="on">
          <div class="login-field">
            <input
              class="login-input"
              id="fullName"
              name="fullName"
              type="text"
              placeholder="Full Name"
              required
            />
            <span class="login-field-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M4.5 20.25a7.5 7.5 0 0 1 15 0"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
          </div>

          <div class="login-field">
            <input
              class="login-input"
              id="email"
              name="email"
              type="email"
              placeholder="Email"
              required
            />
            <span class="login-field-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M3 7l9 6 9-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>

          <div class="login-field">
            <input
              class="login-input"
              id="password"
              name="password"
              type="password"
              placeholder="Password"
              minlength="6"
              required
            />
            <span class="login-field-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect
                  x="5"
                  y="11"
                  width="14"
                  height="10"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M8 11V8a4 4 0 0 1 8 0v3"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
          </div>

          <div class="login-field">
            <input
              class="login-input"
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="Confirm Password"
              minlength="6"
              required
            />
            <span class="login-field-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect
                  x="5"
                  y="11"
                  width="14"
                  height="10"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M8 11V8a4 4 0 0 1 8 0v3"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
          </div>

          <p id="registerError" class="register-error" hidden></p>

          <button class="login-submit-btn" type="submit">Register</button>
        </form>
      </main>
    </div>

    <script>
      document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var errorEl = document.getElementById('registerError');

        if (password !== confirmPassword) {
          errorEl.textContent = 'Passwords do not match.';
          errorEl.hidden = false;
          return;
        }

        errorEl.hidden = true;
        window.location.href = 'login.html';
      });
    </script>
  </body>
</html>
