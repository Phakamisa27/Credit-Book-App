<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f7a4d" />
  <title>Reports · Credit Book</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/reports.css" />
</head>
<body data-page="reports">
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <a class="icon-btn" href="dashboard.html">←</a>
        <h1>Reports</h1>
      </div>
    </header>

    <main class="content" id="reportsRoot">
      <div class="reports-grid">
        <div class="stat-card">
          <div class="stat-label">Total Outstanding</div>
          <div class="stat-value orange" id="repOutstanding">R0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Customers</div>
          <div class="stat-value green" id="repCustomers">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Credit Given</div>
          <div class="stat-value green" id="repCredit">R0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Payments</div>
          <div class="stat-value green" id="repPayments">R0.00</div>
        </div>
      </div>

      <h2 class="section-title">Top Debtors</h2>
      <div id="topDebtors"></div>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item" data-nav="dashboard" href="dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a>
      <a class="nav-item" data-nav="customers" href="customers.html"><span class="nav-icon">👥</span>Customers</a>
      <a class="nav-item" data-nav="transactions" href="transactions.html"><span class="nav-icon">📋</span>Transactions</a>
      <a class="nav-item" data-nav="reports" href="reports.html"><span class="nav-icon">📊</span>Reports</a>
      <a class="nav-item" data-nav="reminders" href="reminders.html"><span class="nav-icon">🔔</span>More</a>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/credit.js"></script>
</body>
</html>
