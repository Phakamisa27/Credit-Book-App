<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f7a4d" />
    <title>Add Customer · Credit Book</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/add-customer.css" />
  </head>
  <body data-page="add-customer">
    <div class="app">
      <header class="app-header">
        <div class="header-row">
          <a class="icon-btn" href="customers.html">←</a>
          <h1>Add Customer</h1>
        </div>
      </header>

      <main class="content">
        <form id="addCustomerForm" autocomplete="off">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              class="form-control"
              id="name"
              name="name"
              type="text"
              placeholder="e.g. Phakamani"
              required
            />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              class="form-control"
              id="phone"
              name="phone"
              type="tel"
              inputmode="numeric"
              maxlength="12"
              placeholder="e.g. 074 099 8882"
            />
          </div>
          <div class="form-group">
            <span class="form-label" id="genderLabel">Gender</span>
            <div
              class="gender-options"
              role="radiogroup"
              aria-labelledby="genderLabel"
            >
              <label class="gender-option">
                <input type="radio" name="gender" value="male" required />
                <span>Male</span>
              </label>
              <label class="gender-option">
                <input type="radio" name="gender" value="female" required />
                <span>Female</span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label for="area">Area</label>
            <input
              class="form-control"
              id="area"
              name="area"
              type="text"
              placeholder="e.g. Umlazi"
            />
          </div>

          <button class="btn btn-primary mt-16" type="submit">
            Save Customer
          </button>
          <a class="btn btn-outline mt-16" href="customers.html">Cancel</a>
        </form>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item" data-nav="dashboard" href="dashboard.html"
          ><span class="nav-icon">🏠</span>Dashboard</a
        >
        <a class="nav-item" data-nav="customers" href="customers.html"
          ><span class="nav-icon">👥</span>Customers</a
        >
        <a class="nav-item" data-nav="transactions" href="transactions.html"
          ><span class="nav-icon">📋</span>Transactions</a
        >
        <a class="nav-item" data-nav="reports" href="reports.html"
          ><span class="nav-icon">📊</span>Reports</a
        >
        <a class="nav-item" data-nav="reminders" href="reminders.html"
          ><span class="nav-icon">🔔</span>More</a
        >
      </nav>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/customers.js"></script>
  </body>
</html>
